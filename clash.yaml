  - name: select
    type: select
    proxies:
      - autoselect
      - load-balance

  - name: autoselect
    type: url-test
    url: https://zhangyangyangman.github.io/vpn/index.html
    interval: 5
    #    proxies:
    use:
      - snakem982
      - Ruk1ng001
      - kooker
      - mahdibland
      - anaer
      - ripaojiedian
      - hello-world-1989
